services:
  api:
    build: ./backend
    ports:
      - "8080:8080"

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-fund --no-audit && npx vite --host 0.0.0.0"
    environment:
      API_URL: http://api:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
