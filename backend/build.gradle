import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id "java"
    id "org.springframework.boot" version "4.1.2"
}

group = "app"
version = "0.0.1"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.apache.poi:poi:5.5.1"
    implementation "org.apache.poi:poi-ooxml:5.5.1"
    runtimeOnly "com.h2database:h2"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.awaitility:awaitility"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

// Regenerates ../sample-uploads from the same generator the seed uses. The output is checked in.
tasks.register("generateSampleUploads", JavaExec) {
    group = "case"
    description = "Writes the sample upload folders to ../sample-uploads"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "app.datasets.seed.SampleUploads"
    args file("../sample-uploads").absolutePath
}
